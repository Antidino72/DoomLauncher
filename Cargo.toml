[package]
name = "slint-rust-template"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
slint = "1.16.1"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "6.0.0"
rfd = "0.17.2"
[build-dependencies]
slint-build = "1.16.1"

[profile.release]
codegen-units = 1
lto = true
